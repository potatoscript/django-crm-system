<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        My CRM
        {% endblock %}
    </title>


    <style>
        .opportunity-filter-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
        }


        .filter-select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            font-size: 15px;
        }
        .pipeline-totals {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0 30px;
        }


        .summary-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
        }


        .summary-card h3 {
            margin-top: 0;
            color: #666;
        }


        .summary-value {
            font-size: 26px;
            font-weight: bold;
        }
        .pipeline-amount {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }
        /* -------------------------
        Sales Pipeline
        ------------------------- */

        .pipeline-summary {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(140px, 1fr));

            gap: 15px;

            margin: 25px 0;
        }


        .pipeline-card {
            background: white;

            padding: 20px;

            border-radius: 8px;

            border: 1px solid #e5e7eb;

            text-align: center;
        }


        .pipeline-card h3 {
            margin-top: 0;

            font-size: 14px;

            color: #666;
        }


        .pipeline-number {
            font-size: 28px;

            font-weight: bold;

            margin-top: 10px;
        }
        /* -------------------------
        Pagination
        ------------------------- */

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;

            margin-top: 25px;
        }


        .pagination a {
            padding: 8px 14px;

            background: white;

            border: 1px solid #ddd;
            border-radius: 6px;

            color: #2563eb;

            text-decoration: none;
        }


        .pagination a:hover {
            background: #f4f6f9;
        }


        .page-info {
            color: #666;
        }
        /* -------------------------
        Customer Search
        ------------------------- */

        .search-form {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 25px 0;
        }


        .search-input {
            width: 320px;

            padding: 10px 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }


        .search-input:focus {
            outline: none;
            border-color: #2563eb;
        }


        .search-result-info {
            margin-bottom: 15px;
            color: #666;
        }


        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
        }
        /* -------------------------
        Delete Customer
        ------------------------- */

        .delete-button {
            display: inline-block;

            padding: 10px 18px;

            background: #dc2626;
            color: white;

            text-decoration: none;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

            margin-left: 8px;
        }


        .delete-button:hover {
            background: #b91c1c;
        }


        .delete-container {
            background: white;

            max-width: 600px;

            margin-top: 30px;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .delete-customer-name {
            margin: 20px 0;

            padding: 15px;

            background: #f4f6f9;

            border-radius: 6px;

            font-size: 20px;
            font-weight: bold;
        }


        .delete-warning {
            color: #dc2626;
            font-weight: bold;
        }
        /* -------------------------
        Customer Details
        ------------------------- */

        .detail-container {
            background: white;
            max-width: 850px;
            margin-top: 30px;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .detail-row {
            display: grid;
            grid-template-columns: 180px 1fr;

            padding: 15px 0;

            border-bottom: 1px solid #eee;
        }


        .detail-row:last-child {
            border-bottom: none;
        }


        .detail-label {
            font-weight: bold;
            color: #666;
        }


        .detail-value {
            color: #222;
        }


        .detail-value a {
            color: #2563eb;
            text-decoration: none;
        }


        .detail-value a:hover {
            text-decoration: underline;
        }
        /* -------------------------
        Forms
        ------------------------- */

        .form-container {
            background: white;

            max-width: 700px;

            margin-top: 30px;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }


        .form-group textarea {
            min-height: 100px;

            resize: vertical;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;

            border-color: #2563eb;
        }


        .form-actions {
            margin-top: 25px;

            display: flex;

            align-items: center;

            gap: 15px;
        }


        button.button {
            border: none;

            cursor: pointer;

            font-size: 15px;
        }


        .cancel-button {
            color: #555;

            text-decoration: none;
        }


        .cancel-button:hover {
            text-decoration: underline;
        }


        .errorlist {
            color: #dc2626;

            margin-top: 6px;

            padding-left: 20px;
        }

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }


        /* -------------------------
           Sidebar
        ------------------------- */

        .sidebar {
            position: fixed;
            width: 220px;
            height: 100vh;
            background: #1f2937;
            color: white;
            padding: 25px;
        }


        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 35px;
        }


        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 0;
            font-size: 17px;
        }


        .sidebar a:hover {
            color: white;
        }


        /* -------------------------
           Main content
        ------------------------- */

        .main {
            margin-left: 220px;
            padding: 30px;
        }


        /* -------------------------
           Dashboard cards
        ------------------------- */

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }


        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 220px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .card h3 {
            margin-top: 0;
            color: #666;
        }


        .number {
            font-size: 32px;
            font-weight: bold;
        }


        /* -------------------------
           Tables
        ------------------------- */

        .table-container {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }


        th {
            color: #666;
        }


        /* -------------------------
           Buttons
        ------------------------- */

        .button {
            display: inline-block;

            padding: 10px 18px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            border-radius: 6px;
        }


        .button:hover {
            background: #1d4ed8;
        }


        /* -------------------------
           Page header
        ------------------------- */

        .page-header {
            display: flex;

            justify-content: space-between;

            align-items: center;
        }

    </style>

</head>


<body>


<div class="sidebar">

    <h2>My CRM</h2>

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'customer_list' %}">
        Customers
    </a>

    <a href="{% url 'contact_list' %}">
        Contacts
    </a>

    <a href="{% url 'opportunity_list' %}">
        Opportunities
    </a>

    <a href="#">
        Activities
    </a>

    <a href="#">
        Reports
    </a>

</div>


<div class="main">

    {% block content %}

    {% endblock %}

</div>


</body>

</html>
