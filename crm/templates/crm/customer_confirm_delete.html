{% extends "crm/base.html" %}


{% block title %}
Delete {{ customer.name }}
{% endblock %}


{% block content %}


<h1>Delete Customer</h1>


<div class="delete-container">

    <h2>
        Are you sure?
    </h2>


    <p>
        You are about to delete:
    </p>


    <div class="delete-customer-name">
        {{ customer.name }}
    </div>


    <p class="delete-warning">
        This action cannot be undone.
    </p>


    <form method="post">

        {% csrf_token %}


        <div class="form-actions">

            <button type="submit"
                    class="delete-button">

                Yes, Delete Customer

            </button>


            <a href="{% url 'customer_detail' customer.pk %}"
               class="cancel-button">

                Cancel

            </a>

        </div>

    </form>

</div>


{% endblock %}
